<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1024px; height: 1024px; }
      .stage {
        width: 1024px;
        height: 1024px;
        position: relative;
        overflow: hidden;
        font-family: "Georgia", "Times New Roman", serif;
        background:
          radial-gradient(120% 90% at 22% 12%, #5a7cb8 0%, rgba(90,124,184,0) 55%),
          linear-gradient(160deg, #41639c 0%, #3a588c 46%, #2d466f 100%);
      }
      .glow {
        position: absolute;
        width: 720px; height: 720px;
        left: 152px; top: 150px;
        background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 62%);
        filter: blur(4px);
      }
      .badge {
        position: absolute;
        top: 96px; left: 50%; transform: translateX(-50%);
        width: 132px; height: 132px;
        border-radius: 34px;
        background: linear-gradient(160deg, #ffffff 0%, #eef2fa 100%);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 18px 44px rgba(20,36,68,0.38);
      }
      .badge span {
        font-weight: 700; font-size: 92px; color: #41639c; line-height: 1;
        margin-top: 4px;
      }
      .art { position: absolute; top: 262px; left: 50%; transform: translateX(-50%); }
      .titlewrap {
        position: absolute; left: 0; right: 0; bottom: 118px; text-align: center;
      }
      .brand {
        font-size: 74px; color: #ffffff; letter-spacing: 0.5px; font-weight: 700;
        text-shadow: 0 4px 18px rgba(16,30,58,0.35);
      }
      .pill {
        display: inline-flex; align-items: center; gap: 14px;
        margin-top: 26px; padding: 16px 34px;
        border-radius: 999px;
        background: rgba(255,255,255,0.14);
        border: 1.5px solid rgba(255,255,255,0.4);
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      }
      .pill .plan { font-size: 34px; color: #fff; font-weight: 700; letter-spacing: 0.3px; }
      .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #f2c14e; }
      .pill .tag { font-size: 30px; color: #f6d488; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="glow"></div>
      <div class="badge"><span>S</span></div>
      <svg class="art" width="500" height="470" viewBox="0 0 500 470" fill="none">
        <defs>
          <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#eaf1fb" />
            <stop offset="1" stop-color="#b9cdec" />
          </linearGradient>
          <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
            <stop offset="1" stop-color="#dbe6f6" stop-opacity="0.9" />
          </linearGradient>
        </defs>
        <!-- liquid -->
        <path d="M120 74 L380 74 L250 250 Z" fill="url(#liquid)" />
        <!-- glass bowl outline -->
        <path d="M96 60 L404 60 L250 258 Z" stroke="url(#glass)" stroke-width="9" fill="none" stroke-linejoin="round" />
        <!-- rim -->
        <ellipse cx="250" cy="60" rx="156" ry="16" stroke="url(#glass)" stroke-width="9" fill="none" />
        <!-- stem -->
        <rect x="243" y="256" width="14" height="150" rx="7" fill="url(#glass)" />
        <!-- base -->
        <ellipse cx="250" cy="418" rx="104" ry="20" fill="url(#glass)" />
        <!-- olive pick -->
        <line x1="300" y1="34" x2="222" y2="150" stroke="#f2c14e" stroke-width="6" stroke-linecap="round" />
        <circle cx="214" cy="162" r="26" fill="#6f9a54" stroke="#57813f" stroke-width="4" />
        <circle cx="222" cy="156" r="8" fill="#c0392b" />
      </svg>
      <div class="titlewrap">
        <div class="brand">SwipeBar&nbsp;Pro</div>
        <div class="pill">
          <span class="plan">Yearly</span>
          <span class="dot"></span>
          <span class="tag">Best value</span>
        </div>
      </div>
    </div>
  </body>
</html>
